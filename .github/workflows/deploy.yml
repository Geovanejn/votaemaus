name: Deploy to Hugging Face
on:
  push:
    branches: [ main ]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          
          # 1. REMOVE APENAS OS ARQUIVOS QUE O HF NÃO ACEITA DE JEITO NENHUM
          # O site vai continuar tendo as imagens e PDFs que você precisa
          rm -f attached_assets/*.zip
          rm -f attached_assets/*.apk
          rm -f attached_assets/*.aab
          
          # 2. Prepara um envio limpo (sem os arquivos deletados acima)
          git checkout --orphan latest_branch
          git add -A
          git commit -m "Deploy: Removendo instaladores pesados, mantendo assets do site"
          git branch -D main
          git branch -m main
          
          # 3. Envia para o Space
          git push -f https://Umpemaus:$HF_TOKEN@huggingface.co/spaces/Umpemaus/umpemaus main
