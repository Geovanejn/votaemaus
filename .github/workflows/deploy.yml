name: Deploy to Hugging Face
on:
  push:
    branches: [ main ]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Remove a pasta de assets pesados para garantir que nada passe de 10MB
          rm -rf attached_assets/
          
          # 2. Configura o Git temporário para o deploy
          git config user.name github-actions
          git config user.email github-actions@github.com
          
          # 3. Cria um novo "histórico" só com os arquivos atuais (sem os fantasmas do passado)
          git checkout --orphan latest_branch
          git add -A
          git commit -am "Deploy limpo"
          git branch -D main
          git branch -m main
          
          # 4. Força o envio para o Hugging Face
          git push -f https://geovane:$HF_TOKEN@huggingface.co/spaces/Umpemaus/umpemaus main
