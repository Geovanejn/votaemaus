name: Deploy to Hugging Face
on:
  push:
    branches: [ main ]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Install LFS
        run: git lfs install

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          
          # 1. FAXINA DE SEGURANÇA: Remove apenas o que é impossível o HF aceitar (APK e ZIP grandes)
          rm -f attached_assets/*.apk
          rm -f attached_assets/*.aab
          rm -f attached_assets/*.zip
          
          # 2. CONFIGURAÇÃO AGRESSIVA DE LFS: 
          # Isso diz ao Git para não tentar subir esses arquivos como código normal
          git lfs track "attached_assets/**"
          git lfs track "client/public/**"
          git lfs track "public/temp-stories/**"
          git lfs track "*.png"
          git lfs track "*.jpg"
          git lfs track "*.webp"
          git lfs track "*.mp3"
          git lfs track "*.mp4"
          git lfs track "*.pdf"
          git add .gitattributes
          
          # 3. CRIA O ENVIO LIMPO
          git checkout --orphan latest_branch
          git add -A
          git commit -m "Deploy: Assets configurados via LFS"
          git branch -D main
          git branch -m main
          
          # 4. PUSH PARA O HUB
          # Usamos o link direto para garantir a permissão
          git push -f https://Umpemaus:$HF_TOKEN@huggingface.co/spaces/Umpemaus/umpemaus main
