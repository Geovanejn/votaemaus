- name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configura o Git
          git config user.name github-actions
          git config user.email github-actions@github.com

          # NÃO vamos mais dar 'rm -rf' na pasta. 
          # Vamos apenas garantir que o LFS cuide dos binários.
          git lfs track "*.png"
          git lfs track "*.jpg"
          git lfs track "*.webp"
          git add .gitattributes

          # Cria um commit limpo com o que REALMENTE está no GitHub agora
          git checkout --orphan latest_branch
          git add -A
          git commit -m "Deploy corrigido - mantendo assets"
          git branch -D main
          git branch -m main

          # Envia para o Hugging Face
          git push -f https://geovane:$HF_TOKEN@huggingface.co/spaces/Umpemaus/umpemaus main
